[package]
name = "microraptor-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
microraptor = { path = ".." }

[[bin]]
name = "fastq_reader"
path = "fuzz_targets/fastq_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack"
path = "fuzz_targets/pack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bgzf_roundtrip"
path = "fuzz_targets/bgzf_roundtrip.rs"
test = false
doc = false
bench = false

