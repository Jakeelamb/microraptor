[package]
name = "microraptor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Slab-based FASTQ streaming core for raw and gzip inputs"

[dependencies]
crc32fast = "1.5"
flate2 = { version = "1.0", optional = true }

[features]
default = ["bgzf", "gzip", "simd"]
bgzf = ["dep:flate2"]
gzip = ["dep:flate2"]
simd = []
