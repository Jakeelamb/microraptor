[package]
name = "microraptor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Streaming FASTQ and FASTA parsing core for raw, gzip, and BGZF inputs"
readme = "README.md"
repository = "https://github.com/Jakeelamb/microraptor"
homepage = "https://github.com/Jakeelamb/microraptor"
documentation = "https://docs.rs/microraptor"
keywords = ["fastq", "fasta", "bioinformatics", "bgzf", "sequencing"]
categories = ["science", "parser-implementations"]
rust-version = "1.87"

[dependencies]
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.0", optional = true }
libdeflater = { version = "1.25.2", optional = true }
memchr = "2.7"

[features]
default = ["bgzf", "gzip"]
bgzf = ["dep:crc32fast", "dep:flate2"]
gzip = ["dep:flate2"]
libdeflate = ["bgzf", "dep:libdeflater"]
simd = []
